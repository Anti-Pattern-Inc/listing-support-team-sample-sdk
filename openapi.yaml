openapi: 3.0.3
info:
  title: AWS Marketplace SaaS Usage Records API
  description: |
    AWS SAMで構築されたAWS Marketplace SaaSサーバーレス統合アプリケーション。
    DynamoDBとSQSを使用したLambdaベースのアーキテクチャで、AWS Marketplaceに掲載されたSaaS製品の使用量メータリングを処理します。
    
    ## 認証方法
    
    ### JWTトークン認証（必須）
    1. `POST /v1/auth/token` でクライアントID + API_KEYを使ってJWTトークンを取得
    2. 取得したトークンを `Authorization: Bearer {jwt-token}` ヘッダーで送信
    3. トークン有効期限: 1時間
    
    **注意**: 直接API_KEY認証は廃止されました。必ずJWTトークン認証をご利用ください。
  version: 1.1.0
  contact:
    name: Anti-Pattern Inc.

servers:
  - url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com/Prod/v1
    description: Production API Gateway endpoint (v1)
    variables:
      apiId:
        description: API Gateway ID
        default: example

security:
  - BearerAuth: []

paths:
  /v1/auth/token:
    post:
      summary: 認証トークン発行
      description: |
        クライアントID（customer_id）とAPI_KEYを用いてJWTトークンを発行します。
        発行されたトークンは1時間有効で、他のAPIエンドポイントのBearerトークンとして使用できます。
      operationId: issueAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - api_key
              properties:
                client_id:
                  type: string
                  description: クライアントID（DynamoDBのcustomer_id）
                  example: "test-customer-001"
                api_key:
                  type: string
                  description: API キー（DynamoDBのapi_key）
                  example: "ak-1234567890abcdef"
            examples:
              auth_request:
                summary: 認証リクエスト例
                value:
                  client_id: "test-customer-001"
                  api_key: "ak-1234567890abcdef"
      responses:
        '200':
          description: 認証成功、JWTトークンが発行されました
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWTアクセストークン
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type:
                    type: string
                    description: トークンタイプ
                    example: "Bearer"
                  expires_in:
                    type: string
                    description: トークン有効期限
                    example: "1h"
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: 無効なクレデンシャル
                  value:
                    error: "Authentication failed"
                    message: "Invalid client credentials"
                inactive_client:
                  summary: 無効なクライアント
                  value:
                    error: "Authentication failed"
                    message: "Client account is inactive"
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: プリフライトリクエスト (CORS)
      description: CORS プリフライトリクエストの処理
      operationId: authTokenOptions
      security: []
      responses:
        '200':
          description: CORS プリフライト成功
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: "POST,OPTIONS"
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: "Content-Type,Authorization"

  /v1/usage-records:
    get:
      summary: 使用量レコードリスト取得
      description: |
        AWS Marketplace SaaS製品の使用量レコードをDynamoDBから取得します。
        認証済み顧客のレコードのみを返し、タイムスタンプ範囲やメータリングステータスでのフィルタリングが可能です。
      operationId: listUsageRecords
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: query
          description: 製品IDでフィルタリング
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9-_]+$'
            example: "test-product"
        - name: start_timestamp
          in: query
          description: |
            開始タイムスタンプ（UNIXタイムスタンプ）。
            end_timestampが指定されていない場合は、このタイムスタンプの特定レコードを取得します。
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
            example: "1722502800000"
        - name: end_timestamp
          in: query
          description: 終了タイムスタンプ（UNIXタイムスタンプ）
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
            example: "1722589200000"
        - name: limit
          in: query
          description: 取得するレコード数の上限（最大100）
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
            default: "50"
            example: "50"
        - name: next_token
          in: query
          description: ページネーション用のトークン（前回レスポンスのnextTokenを指定）
          required: false
          schema:
            type: string
            example: "eyJjdXN0b21lcklkZW50aWZpZXIiOnsiUyI6InRlc3QtY3VzdG9tZXItMDAxIn0sImNyZWF0ZV90aW1lc3RhbXAiOnsiTiI6IjE3MjI1MDI4MDAwMDAifX0="
        - name: status
          in: query
          description: |
            メータリングステータスでフィルタリング
            - pending: メータリング待ちレコードのみ
            - completed: メータリング完了レコードのみ
            - all: 全レコード（デフォルト）
          required: false
          schema:
            type: string
            enum: [pending, completed, all]
            default: "all"
            example: "all"
      responses:
        '200':
          description: レコード取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    $ref: '#/components/schemas/UsageRecordResponse'
                    description: 特定レコード取得時（start_timestampのみ指定）
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageRecordResponse'
                    description: レコード一覧取得時
                  count:
                    type: number
                    description: 返却されたレコード数
                    example: 5
                  totalRecords:
                    type: number
                    description: フィルタリング前の総レコード数
                    example: 10
                  nextToken:
                    type: string
                    description: 次のページ取得用のトークン（ページネーション用）
                    example: "eyJjdXN0b21lcklkZW50aWZpZXIiOnsiUyI6InRlc3QtY3VzdG9tZXItMDAxIn0sImNyZWF0ZV90aW1lc3RhbXAiOnsiTiI6IjE3MjI1MDI4MDAwMDAifX0="
                  requestId:
                    type: string
                    description: リクエストID
                    example: "12345678-1234-1234-1234-123456789012"
              examples:
                single_record:
                  summary: 特定レコード取得
                  value:
                    record:
                      customerIdentifier: "test-customer-001"
                      create_timestamp: 1722502800000
                      product_id: "test-product"
                      metering_pending: true
                      dimension_usage:
                        - dimension: "requests"
                          value: 10
                          usage_allocations:
                            - allocated_usage_quantity: 5
                              tags:
                                - key: "team"
                                  value: "engineering"
                    requestId: "12345678-1234-1234-1234-123456789012"
                multiple_records:
                  summary: レコード一覧取得
                  value:
                    records:
                      - customerIdentifier: "test-customer-001"
                        create_timestamp: 1722502800000
                        product_id: "test-product"
                        metering_pending: true
                        dimension_usage:
                          - dimension: "requests"
                            value: 10
                      - customerIdentifier: "test-customer-001"
                        create_timestamp: 1722506400000
                        product_id: "test-product"
                        metering_pending: false
                        dimension_usage:
                          - dimension: "storage"
                            value: 100
                        metering_result: "SUCCESS"
                        metering_timestamp: 1722507000000
                    count: 2
                    totalRecords: 2
                    nextToken: null
                    requestId: "12345678-1234-1234-1234-123456789012"
        '400':
          description: リクエストパラメータエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_limit:
                  summary: 制限値エラー
                  value:
                    error: "Limit cannot exceed 100"
                    requestId: "12345678-1234-1234-1234-123456789012"
                validation_error:
                  summary: バリデーションエラー
                  value:
                    error: "Validation failed: limit: should match pattern"
                    requestId: "12345678-1234-1234-1234-123456789012"
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: レコードが見つからない（特定レコード取得時）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                record_not_found:
                  summary: レコード未存在
                  value:
                    error: "Usage record not found"
                    requestId: "12345678-1234-1234-1234-123456789012"
        '500':
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 新規使用量レコード作成
      description: |
        AWS Marketplace SaaS製品の使用量レコードをDynamoDBに保存します。
        重複レコードの作成を防止し、並列処理で複数レコードを効率的に処理します。
      operationId: createUsageRecords
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/UsageRecord'
            examples:
              single_record:
                summary: 単一レコード例
                value:
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-001"
                    dimension:
                      name: "requests"
                      quantity: 10
                    start_time: "2025-08-01T07:00:00Z"
              multiple_records:
                summary: 複数レコード例
                value:
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-001"
                    dimension:
                      name: "requests"
                      quantity: 10
                    start_time: "2025-08-01T07:00:00Z"
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-002"
                    dimension:
                      name: "requests"
                      quantity: 25
                    start_time: "2025-08-01T08:00:00Z"
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-003"
                    dimension:
                      name: "storage"
                      quantity: 100
                    start_time: "2025-08-01T09:00:00Z"
              with_allocations:
                summary: 使用量アロケーション付き例
                value:
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-001"
                    dimension:
                      name: "requests"
                      quantity: 10
                      usage_allocations:
                        - allocated_usage_quantity: 5
                          tags:
                            - key: "team"
                              value: "engineering"
                        - allocated_usage_quantity: 5
                          tags:
                            - key: "team"
                              value: "sales"
                    start_time: "2025-08-01T07:00:00Z"
      responses:
        '200':
          description: 全レコードが正常に作成されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '207':
          description: 部分的に成功（一部レコードが失敗）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialSuccessResponse'
        '400':
          description: リクエストの検証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 全レコードが重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: 既存使用量レコード更新
      description: |
        CustomerIdentifierとTimestampで特定される既存レコードを更新します。
        metering_failed = falseの場合（AWS Marketplace API連携済み）は更新を拒否します。
        quantity と usage_allocations のみ更新可能です。
      operationId: updateUsageRecords
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/UsageRecord'
            examples:
              quantity_update:
                summary: 数量更新例
                value:
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-001"
                    dimension:
                      name: "requests"
                      quantity: 15
                    start_time: "2025-08-01T07:00:00Z"
              allocations_update:
                summary: 使用量アロケーション更新例
                value:
                  - product_id: "test-product"
                    CustomerIdentifier: "test-customer-001"
                    dimension:
                      name: "requests"
                      quantity: 15
                      usage_allocations:
                        - allocated_usage_quantity: 8
                          tags:
                            - key: "team"
                              value: "engineering"
                        - allocated_usage_quantity: 7
                          tags:
                            - key: "team"
                              value: "sales"
                    start_time: "2025-08-01T07:00:00Z"
      responses:
        '200':
          description: 全レコードが正常に更新されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSuccessResponse'
        '207':
          description: 部分的に成功（一部レコードが失敗）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialUpdateResponse'
        '400':
          description: リクエストの検証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 全レコードが更新不可（レコード未存在または処理済み）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotUpdatableResponse'
        '500':
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    options:
      summary: CORS preflight request
      description: CORS preflight request for usage-records endpoint
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication using JWT tokens only.
        
        **認証手順:**
        1. `/v1/auth/token` エンドポイントでJWTトークンを取得
        2. Authorization: Bearer {jwt-token}
        
        Format: Authorization: Bearer {jwt-token}
  schemas:
    UsageRecord:
      type: object
      required:
        - product_id
        - CustomerIdentifier
        - dimension
        - start_time
      properties:
        product_id:
          type: string
          pattern: '^[a-zA-Z0-9-_]+$'
          minLength: 1
          description: AWS Marketplace製品ID
          example: "test-product"
        CustomerIdentifier:
          type: string
          pattern: '^[a-zA-Z0-9-_]+$'
          minLength: 1
          description: 顧客識別子
          example: "test-customer-001"
        dimension:
          $ref: '#/components/schemas/Dimension'
        start_time:
          type: string
          format: date-time
          description: 使用量レコードの開始時刻（ISO 8601形式）
          example: "2025-08-01T07:00:00Z"
      additionalProperties: false

    Dimension:
      type: object
      required:
        - name
        - quantity
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          description: ディメンション名
          example: "requests"
        quantity:
          type: number
          minimum: 1
          description: 使用量
          example: 10
        usage_allocations:
          type: array
          description: 使用量アロケーション（オプション）
          items:
            $ref: '#/components/schemas/UsageAllocation'
        dry_run:
          type: boolean
          description: ドライラン実行フラグ（オプション）
          example: false
      additionalProperties: false

    UsageAllocation:
      type: object
      properties:
        allocated_usage_quantity:
          type: number
          minimum: 0
          description: 割り当て使用量
          example: 5
        tags:
          type: array
          description: アロケーションに関連するタグ
          items:
            $ref: '#/components/schemas/Tag'
      additionalProperties: false

    Tag:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          description: タグキー
          example: "team"
        value:
          type: string
          minLength: 1
          description: タグ値
          example: "engineering"
      additionalProperties: false

    RecordResult:
      type: object
      properties:
        success:
          type: boolean
          description: レコード処理の成功/失敗
        customerIdentifier:
          type: string
          description: 顧客識別子
        timestamp:
          type: number
          description: レコードのタイムスタンプ
        recordId:
          type: string
          description: レコードID（顧客識別子:タイムスタンプ）
        requestId:
          type: string
          description: リクエストID
        error:
          type: string
          description: エラーメッセージ（失敗時）
        errorCode:
          type: string
          description: エラーコード（失敗時）
          enum:
            - DUPLICATE_RECORD
            - RECORD_NOT_UPDATABLE
            - SAVE_FAILURE
            - UPDATE_FAILURE
        httpStatusCode:
          type: number
          description: HTTPステータスコード（失敗時）

    UpdateRecordResult:
      allOf:
        - $ref: '#/components/schemas/RecordResult'
        - type: object
          properties:
            updatedFields:
              type: array
              items:
                type: string
              description: 更新されたフィールド一覧

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "All records saved successfully"
        totalRecords:
          type: number
          example: 2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecordResult'

    UpdateSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "All records updated successfully"
        totalRecords:
          type: number
          example: 2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRecordResult'

    PartialSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Partial success"
        totalRecords:
          type: number
          example: 3
        successfulRecords:
          type: number
          example: 2
        failedRecords:
          type: number
          example: 1
        duplicateRecords:
          type: number
          example: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecordResult'

    PartialUpdateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Partial success"
        totalRecords:
          type: number
          example: 3
        successfulRecords:
          type: number
          example: 2
        failedRecords:
          type: number
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRecordResult'

    ConflictResponse:
      type: object
      properties:
        error:
          type: string
          example: "All records already exist"
        totalRecords:
          type: number
          example: 2
        duplicateRecords:
          type: number
          example: 2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecordResult'

    NotUpdatableResponse:
      type: object
      properties:
        error:
          type: string
          example: "Records not found or already processed (metering failed = false)"
        requestId:
          type: string
        totalRecords:
          type: number
          example: 2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRecordResult'

    UsageRecordResponse:
      type: object
      properties:
        customerIdentifier:
          type: string
          description: 顧客識別子
          example: "test-customer-001"
        create_timestamp:
          type: number
          description: レコード作成タイムスタンプ（UNIXタイムスタンプ）
          example: 1722502800000
        product_id:
          type: string
          description: AWS Marketplace製品ID
          example: "test-product"
        metering_pending:
          type: boolean
          description: メータリング待ちフラグ
          example: true
        dimension_usage:
          type: array
          description: ディメンション使用量データ
          items:
            type: object
            properties:
              dimension:
                type: string
                description: ディメンション名
                example: "requests"
              value:
                type: number
                description: 使用量値
                example: 10
              usage_allocations:
                type: array
                description: 使用量アロケーション（オプション）
                items:
                  type: object
                  properties:
                    allocated_usage_quantity:
                      type: number
                      description: 割り当て使用量
                      example: 5
                    tags:
                      type: array
                      description: アロケーションタグ
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            description: タグキー
                            example: "team"
                          value:
                            type: string
                            description: タグ値
                            example: "engineering"
        metering_result:
          type: string
          description: メータリング結果（処理済みの場合）
          example: "SUCCESS"
        metering_timestamp:
          type: number
          description: メータリング処理タイムスタンプ（処理済みの場合）
          example: 1722507000000
        metering_response:
          type: string
          description: メータリングAPIレスポンス（処理済みの場合）
          example: "{\"meteringRecordId\":\"12345\"}"
      required:
        - customerIdentifier
        - create_timestamp
        - product_id
        - metering_pending

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: エラーメッセージ
        requestId:
          type: string
          description: リクエストID
      required:
        - error
